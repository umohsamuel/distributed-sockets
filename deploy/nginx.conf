# Host nginx site for the demo. __API_DOMAIN__ is filled in by the deploy workflow,
# which installs this once and lets certbot add TLS; later edits go on the server.
server {
    listen 80;
    server_name __API_DOMAIN__;

    location /s1/ {
        proxy_pass http://127.0.0.1:9001/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /s2/ {
        proxy_pass http://127.0.0.1:9002/;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = / {
        default_type text/plain;
        return 200 "distributed-sockets: try /s1/info or /s2/info\n";
    }
}
