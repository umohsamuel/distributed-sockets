name: distributed-sockets

x-server: &server
  image: distributed-sockets-server:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - demo

x-server-env: &server-env
  PORT: ":8080"
  PRODUCTION_ENVIRONMENT: "true"
  GIN_MODE: release
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  RABBITMQ_ADDR: rabbitmq:5672
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

# The servers only listen on loopback; the host's nginx (deploy/nginx.conf)
# terminates TLS and routes /s1/* and /s2/* to them.
services:
  server-1:
    <<: *server
    ports:
      - "127.0.0.1:9001:8080"
    environment:
      <<: *server-env
      SERVER_ID: server-1

  server-2:
    <<: *server
    ports:
      - "127.0.0.1:9002:8080"
    environment:
      <<: *server-env
      SERVER_ID: server-2

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - demo

networks:
  demo:
